agent:
  model: gpt-4o
  max_tokens: 4096
  max_iterations: 10
  system_prompt: |
    You are agent_patches, an AI agent that handles server administration tasks.
    Use the available tools to carry out the user's request. Be concise and direct.
  # api_key: change-me        # defaults to OPENAI_API_KEY env var when omitted
  # base_url: https://api.openai.com/v1  # override for Azure, local models, etc.

logging:
  level: info
  file: /opt/agent_patches/logs/agent_patches.log

storage:
  tasks_file: /opt/agent_patches/data/tasks.jsonl

server:
  host: 0.0.0.0
  port: 9976
  #optional> public_url: http://server.home.example.com:9976  # URL embedded in the agent card; if unset, derived from the host's FQDN (via reverse DNS) or hostname

# security.scheme: "none" | "bearer"
# When scheme is "bearer", callers must supply: Authorization: Bearer <token>
security:
  scheme: bearer
  token: change-me

# memory configures the file-backed agent memory store.
# Snapshots are retained for 60 minutes (one per 5-minute bucket); older files
# are automatically deleted on each write. attrs.json stores general attributes
# without history.
memory:
  root: /opt/agent_patches/data/memory

# loop is a generic background loop that wakes up on a fixed interval for the
# lifetime of the server. It always starts automatically; the interval is
# the only configurable setting.
loop:
  heartbeat: "1s"   # how often the loop wakes up; any Go duration string (default: 1s)

# responsibilities is a dynamic list of recurring duties for the agent. Each
# is run on its own schedule, in its own goroutine; if a previous run of a
# responsibility is still in flight when it comes due again, that run is
# skipped and an error is logged.
#
# Each entry must set exactly one of "frequency" (a Go duration string for
# recurring runs, e.g. "1h") or "time" (a local HH:MM wall-clock time for a
# once-daily run). "tools" optionally names the skills/tools to make available
# while carrying out the instruction, e.g. disk_usage, memory_usage,
# network_usage, login_sessions, patch, read_memory, system_info,
# report_findings. Include report_findings to let the agent record
# observations, actions, recommendations, or approval requests that are
# surfaced via GET /status.
#
# "when_to_notify" controls when a notification is stored to agent memory
# after a run: "always" (every run), "on_error"/"on error" (failures only,
# the default), or "never".
#
# Every responsibility run uses responsibility_system_prompt (below) as the
# system prompt; the responsibility's "instruction" is sent as the user prompt.
# On startup, the server runs the system_info skill once and appends a report
# of the host's static metadata (OS, CPU, memory, disks, network interfaces)
# to responsibility_system_prompt, so every responsibility has that context.
responsibility_system_prompt: |
  You are agent_patches, an AI system administrator. You are responsible for
  the health, security, and upkeep of this Linux system. You will be given one
  specific responsibility to carry out using the tools available to you.
  Investigate thoroughly, take corrective action when it is safe and
  appropriate to do so, and report what you found and did clearly and
  concisely. If report_findings is available to you, call it whenever you
  observe something noteworthy, take an action, have a recommendation, or
  need operator approval before proceeding.

  TOOL SELECTION RULES (follow these exactly):
  - run_diagnostic_command: use this for ALL read-only shell commands — ps,
    top, df, du, find, cat, grep, ss, netstat, journalctl, dmesg, systemctl
    status, apt-cache, rpm -q, docker ps/inspect/logs,
    podman ps/inspect/logs, kubectl get/describe/logs,
    virsh list/dominfo/domstats, and any other command that only reads or
    reports. These execute immediately with no operator involvement. This is
    the default tool for investigation. A command is read-only based on what
    it does, not why you are running it — listing, querying, and reporting
    commands are ALWAYS run_diagnostic_command, even when the system has a
    critical problem. Example: disk full at 100% — use run_diagnostic_command
    for "find / -xdev -type f -size +100M | sort -rn | head -20" to identify
    large files, then use run_approved_command only for the actual deletion
    such as "rm /var/log/old.log". The investigation step never requires
    approval regardless of how urgent the situation is.
  - run_approved_command: use this ONLY when you intend to change system
    state — installing or removing packages, starting/stopping/restarting
    services, deleting or overwriting files, modifying configuration. Never
    route an informational or read-only command through run_approved_command.
    If you find yourself writing a ps, df, du, cat, find, or grep command
    into run_approved_command, stop and use run_diagnostic_command instead.
    If no corrective action is needed, do NOT call run_approved_command at
    all — simply write your conclusion in your response text or call
    report_findings. Never submit a "no action required" or "none" approval
    request; that wastes an operator approval slot.
  - Do not run echo commands through any tool. If you want to state a
    conclusion or confirm that a check passed, write it in your response
    text or call report_findings. Running echo via a command tool produces
    no useful information and wastes an approval slot.
responsibilities:
  - name: disk-space-check
    frequency: "1h"
    instruction: |
      Check disk usage on all mounted filesystems. Review disk space usage,
      SMART health, and the largest directories and files on each disk.
      If any filesystem is above 90% capacity, use run_diagnostic_command to
      investigate the root cause (e.g. du -sh /var/log/* or find /var -name
      "*.log" -size +100M). Once you have identified a safe remediation (e.g.
      clearing old logs or temporary files), submit that command via
      run_approved_command for operator approval before executing it. Do not
      propose commands for SMART hardware failures — report those findings only.
    tools:
      - check_drives
      - run_diagnostic_command
      - run_approved_command
    when_to_notify: "on error"
  - name: cpu-utilization-check
    frequency: "30m"
    instruction: |
      Check CPU utilization on this host. Report overall CPU usage percentage,
      logical CPU count, and load averages. If CPU usage is above 80% or any
      load average exceeds the number of logical CPUs, use run_diagnostic_command
      to investigate — for example (ps aux --sort=-%cpu | head -20) to identify
      the top consumers. Report your findings. Only use run_approved_command if
      you determine a specific remediation action is warranted and safe to propose.
      Do not act if CPU usage is within normal bounds.
    tools:
      - analyze_cpu_utilization
      - run_diagnostic_command
      - run_approved_command
    when_to_notify: "on error"
  - name: memory-utilization-check
    frequency: "30m"
    instruction: |
      Check memory utilization on this host. Report total RAM, used memory,
      available memory, and swap usage. If memory usage is above 80%, use
      run_diagnostic_command to investigate — for example
      (ps aux --sort=-%mem | head -20) to identify top consumers. Report your
      findings. For sustained critical memory pressure above 90% where a specific
      safe remediation exists, propose it via run_approved_command for operator
      approval. Do not act if memory is within normal bounds.
    tools:
      - analyze_memory_utilization
      - run_diagnostic_command
      - run_approved_command
    when_to_notify: "on error"
  - name: network-utilization-check
    frequency: "1h"
    instruction: |
      Check network utilization on all active interfaces. Report upload and
      download rates. If any interface shows unusually high or unexpected traffic,
      use run_diagnostic_command to investigate — for example
      (ss -tunap | head -40) to list active connections and the processes behind
      them. Report findings even when no action is needed. Only use
      run_approved_command if a specific remediation is warranted; do not propose
      commands unless traffic is clearly anomalous.
    tools:
      - analyze_network_utilization
      - run_diagnostic_command
      - run_approved_command
    when_to_notify: "on error"
  - name: daily-summary
    time: "07:00"
    instruction: |
      Summarize overnight system activity, including any errors, restarts,
      or completed patch runs, and produce a short report.
    tools:
      - read_agent_memory
    when_to_notify: "always"
  - name: keep-system-up-to-date
    time: "03:00"
    instruction: |
      Ensure the system is up to date. Use the patch tool to check for and
      apply any available OS updates, rebooting if required.
    tools:
      - check_for_pending_system_patches
    when_to_notify: "always"
