# OpenTelemetry trace export is configured entirely through environment
# variables (not this file), using the same standard OTEL_* names as
# central-backend and central-ui:
#   OTEL_EXPORTER_OTLP_ENDPOINT   collector base URL, e.g. http://otel-collector:4318
#                                 unset (the default) disables tracing entirely.
#   OTEL_SERVICE_NAME             defaults to "endpoint-server-<FQDN>" (e.g.
#                                 "endpoint-server-myhost.example.com");
#                                 set only to override the auto-detected name.
#   OTEL_RESOURCE_ATTRIBUTES      extra comma-separated key=value resource attrs
#   OTEL_EXPORTER_OTLP_HEADERS    comma-separated key=value auth headers
#   OTEL_TRACES_SAMPLER           default: parentbased_always_on
#   OTEL_TRACES_SAMPLER_ARG       sampler argument (e.g. a ratio)
# Set these as Windows service environment variables (e.g. via the service
# manager or `sc.exe`/registry) before starting patches-endpoint-server.

agent:
  # model: gpt-4o             # optional; omit to use the gateway's configured
  # default model (GATEWAY_UPSTREAM_MODEL). Set this only when this agent
  # should use a different model than the gateway default.
  max_tokens: 6144
  # responsibility_max_tokens: 2048  # optional tighter completion cap for
  # scheduled responsibility runs only; their reports are short, and a tight
  # cap bounds how long a runaway generation can hold an LLM concurrency slot.
  max_iterations: 10
  system_prompt: |
    You are agent_patches, an AI agent that handles server administration tasks.
    Use the available tools to carry out the user's request. Be concise and direct.
  # api_key: change-me        # defaults to OPENAI_API_KEY env var when omitted
  # base_url: https://api.openai.com/v1  # override for Azure, local models, etc.
  # request_timeout: 6m       # per-LLM-call HTTP timeout; set above GATEWAY_REQUEST_TIMEOUT (default 5m)

logging:
  level: info
  file: C:/ProgramData/agent_patches/logs/agent_patches.log

storage:
  tasks_file: C:/ProgramData/agent_patches/data/tasks.jsonl

server:
  host: 0.0.0.0
  port: 9976
  #optional> public_url: http://server.home.example.com:9976  # URL embedded in the agent card; if unset, derived from the host's FQDN (via reverse DNS) or hostname

# security.scheme: "none" | "bearer"
# When scheme is "bearer", callers must supply: Authorization: Bearer <token>
security:
  scheme: bearer
  token: change-me

# memory configures the file-backed agent memory store.
# Snapshots are retained for 60 minutes (one per 5-minute bucket); older files
# are automatically deleted on each write. attrs.json stores general attributes
# without history.
memory:
  root: C:/ProgramData/agent_patches/data/memory

# status controls the AI-generated one-sentence description shown in the
# dashboard when the server is in an "attention" state. The summary is
# cached and only regenerated when the alert content changes or the TTL elapses.
status:
  summary_ttl: "1h"   # max cache age; summary also refreshes instantly on any alert change

# loop is a generic background loop that wakes up on a fixed interval for the
# lifetime of the server. It always starts automatically; the interval is
# the only configurable setting.
loop:
  heartbeat: "1s"   # how often the loop wakes up; any Go duration string (default: 1s)

# responsibilities is a dynamic list of recurring duties for the agent. Each
# is run on its own schedule, in its own goroutine; if a previous run of a
# responsibility is still in flight when it comes due again, that run is
# skipped and an error is logged.
#
# Each entry must set exactly one of "frequency" (a Go duration string for
# recurring runs, e.g. "1h") or "time" (a local HH:MM wall-clock time for a
# once-daily run). "tools" optionally names the skills/tools to make available
# while carrying out the instruction, e.g. disk_usage, memory_usage,
# network_usage, login_sessions, patch, read_memory, system_info,
# report_findings. Include report_findings to let the agent record
# observations, actions, recommendations, or approval requests that are
# surfaced via GET /status.
#
# "when_to_notify" controls when a notification is stored to agent memory
# after a run: "always" (every run), "on_error"/"on error" (failures only,
# the default), or "never".
#
# Every responsibility run uses a shared system prompt; the responsibility's
# "instruction" is sent as the user prompt. The prompt is loaded from
# windows-system-prompt.txt in the same directory as this file (deployed
# automatically by deploy.sh from config/windows-system-prompt.txt in the
# repository). Set responsibility_system_prompt below ONLY to override that
# file for this specific host; when both are absent a built-in default is
# used. On startup, the server runs the system_info skill once and appends a
# report of the host's static metadata (OS, CPU, memory, disks, network
# interfaces) to the prompt, so every responsibility has that context.
#responsibility_system_prompt: |
#  <host-specific override — normally leave unset>

# responsibilities: host-specific overrides and additions.
# Default Windows responsibilities are loaded automatically from
# windows-responsibilities.yaml in the same directory as this file.
# Define entries here only to override a default by name or to add
# responsibilities unique to this host. Leave this empty (or omit it)
# to use the defaults as-is.
responsibilities: []
