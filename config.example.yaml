agent:
  model: gpt-4o
  max_tokens: 4096
  max_iterations: 10
  system_prompt: |
    You are agent_patches, an AI agent that handles server administration tasks.
    Use the available tools to carry out the user's request. Be concise and direct.
  # api_key: change-me        # defaults to OPENAI_API_KEY env var when omitted
  # base_url: https://api.openai.com/v1  # override for Azure, local models, etc.

logging:
  level: info
  # file: /var/log/agent_patches.log  # omit to log to stderr

tasks:
  enabled:
    - hello

storage:
  tasks_file: tasks.jsonl

server:
  host: 0.0.0.0
  port: 8080
  # public_url: http://server.home.example.com:8080  # URL embedded in the agent card; set this when clients connect remotely

# security.scheme: "none" | "bearer"
# When scheme is "bearer", callers must supply: Authorization: Bearer <token>
security:
  scheme: bearer
  token: change-me

# login_monitor listens for interactive user logins via systemd-logind (D-Bus).
# Requires the server to run on a Linux host with systemd.
login_monitor:
  enabled: true

# network_upload_monitor alerts when the outbound (upload) rate exceeds the threshold.
# network_download_monitor alerts when the inbound (download) rate exceeds the threshold.
# Both measure aggregate throughput across all physical interfaces; thresholds are in MB/s.
network_upload_monitor:
  enabled: false
  threshold_mbps: 100  # alert when upload rate reaches or exceeds this MB/s
  interval: "1m"       # sampling interval; any Go duration string (default: 1m)

network_download_monitor:
  enabled: false
  threshold_mbps: 100  # alert when download rate reaches or exceeds this MB/s
  interval: "1m"

# memory_monitor periodically checks RAM and swap usage and notifies when either
# exceeds the configured threshold. Works on Linux, macOS, and Windows.
memory_monitor:
  enabled: true
  threshold_percent: 90       # alert when RAM used % reaches or exceeds this (default: 90)
  swap_threshold_percent: 80  # alert when swap used % reaches or exceeds this; 0 = disabled (default: 80)
  interval: "5m"              # how often to check; any Go duration string (default: 5m)

# disk_monitor periodically checks all local disks and notifies when any exceeds
# the usage threshold. Works on Linux, macOS, and Windows.
disk_monitor:
  enabled: true
  threshold_percent: 85   # alert when used % reaches or exceeds this value (default: 85)
  interval: "1h"          # how often to check; any Go duration string (default: 1h)

# daily_tasks controls the background maintenance loop.
# The loop goroutine always starts; individual tasks are gated by their own enabled flag.
daily_tasks:
  wake_time: "00:00"     # local wall-clock time (HH:MM) to run all enabled tasks (default: midnight)
  patch_check:
    enabled: true        # check for OS updates and notify when found

# memory configures the file-backed agent memory store.
# Snapshots are retained for 60 minutes (one per 5-minute bucket); older files
# are automatically deleted on each write. attrs.json stores general attributes
# without history.
memory:
  root: ./agent_memory   # root directory for all memory files (default: ./agent_memory)

# Notifier sends event messages to configured sinks before and after patching.
notifier:
  email:
    enabled: false
    host: smtp.example.com
    port: 587
    username: alerts@example.com
    password: change-me
    from: alerts@example.com
    to:
      - admin@example.com
    # tls_mode: "starttls" (default, port 587) | "tls" (implicit TLS, port 465) | "none" (local relay)
    tls_mode: starttls
