# linux-responsibilities.yaml — Default responsibilities for Linux (all distros).
#
# Loaded automatically at startup when the server is running on Linux,
# alongside the main config.yaml in the same directory.
# Any responsibility defined in config.yaml with the same name overrides the
# entry here; responsibilities with unique names are additive.
#
# Each entry must set exactly one of:
#   frequency: Go duration string (e.g. "1h", "30m") — recurring
#   time:      local HH:MM wall-clock time — once-daily
#
# "tools" names the skills available during the run.
# "when_to_notify": "always" | "on_error" (default) | "never"
#
# NOTE: the responsibility names below are bound to deterministic pre-checks
# registered in endpoint-server/main.go. A pre-check runs the health survey
# without the LLM and skips the LLM call entirely when everything is healthy;
# the instruction only reaches the model when a problem was found, with the
# pre-gathered report appended. Renaming a responsibility detaches its
# pre-check, and every scheduled tick pays for a full LLM run again.

responsibilities:
  - name: disk-space-check
    frequency: "4h"
    instruction: |
      A disk problem was detected on this host — see the pre-gathered report
      included with this instruction (usage, SMART status, and the largest
      directories and files per disk). Do not call check_drives again unless
      you want a fresh read.
      Compare current usage against history with compare_to_baseline
      (domain: check_drives): report each filesystem's growth rate and, for
      any filesystem trending upward, the predicted time until full.
      If any filesystem is above 90% capacity, use run_diagnostic_command to
      investigate the root cause (e.g. du -sh /var/log/* or find /var -name
      "*.log" -size +100M). Once you have identified a safe remediation (e.g.
      clearing old logs or temporary files), submit that command via
      run_approved_command for operator approval before executing it. Do not
      propose commands for SMART hardware failures — report those findings only.
      Track persistent problems in the incident ledger: report new ones with a
      stable fingerprint, record recurrences and actions, and resolve incidents
      that have cleared.
    tools:
      - check_drives
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: cpu-utilization-check
    frequency: "1h"
    instruction: |
      Elevated CPU load was detected on this host — usage at/above 80% or a
      load average exceeding the logical CPU count. See the pre-gathered
      report included with this instruction; do not call
      analyze_cpu_utilization again unless you want a fresh read.
      Use compare_to_baseline
      (domain: analyze_cpu_utilization) to judge whether current load is normal
      for this host — distinguish sustained pressure from a momentary spike.
      Use run_diagnostic_command to investigate — for example
      (ps aux --sort=-%cpu | head -20) to identify the top consumers. Report
      your findings. Only use run_approved_command if you determine a specific
      remediation action is warranted and safe to propose. Do not act if the
      load turns out to be normal for this host. Track persistent problems (e.g. the same
      runaway process seen across runs) in the incident ledger rather than
      re-reporting them each time, and resolve incidents that have cleared.
    tools:
      - analyze_cpu_utilization
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: memory-utilization-check
    frequency: "1h"
    instruction: |
      A memory problem was detected on this host — RAM usage at/above 80%, or
      day-over-day growth of 20+ percentage points that suggests a leak. See
      the pre-gathered report included with this instruction; do not call
      analyze_memory_utilization again unless you want a fresh read.
      Use compare_to_baseline
      (domain: analyze_memory_utilization) to compare against this host's
      normal usage and judge whether the pressure is persistent or growing.
      Use run_diagnostic_command to investigate — for example
      (ps aux --sort=-%mem | head -20) to identify top consumers. Report your
      findings. For sustained critical memory pressure above 90% where a
      specific safe remediation exists, propose it via run_approved_command for
      operator approval. Do not act if memory turns out to be within normal
      bounds. Track persistent problems in the incident ledger and resolve
      incidents that have cleared.
    tools:
      - analyze_memory_utilization
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: network-utilization-check
    frequency: "6h"
    instruction: |
      Unusual network traffic was detected on this host — the current rate
      exceeds 3x this host's 7-day median, or the host is too new to have a
      baseline yet. See the pre-gathered report included with this
      instruction; do not call analyze_network_utilization again unless you
      want a fresh read. Use compare_to_baseline
      (domain: analyze_network_utilization) for additional historical context.
      Use run_diagnostic_command to
      investigate — for example (ss -tunap | head -40) to list active
      connections and the processes behind them. Report your findings, and
      always state explicitly how current traffic
      compares to the baseline (e.g. "within normal range" or "2x the 7-day
      average"). Only use run_approved_command if a specific remediation
      is warranted; do not propose commands unless traffic is clearly
      anomalous. Track persistent anomalies in the incident ledger and resolve
      incidents that have cleared.
    tools:
      - analyze_network_utilization
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: security-posture-check
    time: "06:00"
    instruction: |
      Review this host's security posture for drift. Run check_security_posture
      to capture the current posture (listening ports, local users, admin/sudo
      group membership, sudoers fingerprint, per-user authorized_keys
      fingerprints, setuid binaries) and compare it against the previous
      snapshot. Focus on what CHANGED — new or removed listening ports, new
      users or admins, sudoers or authorized_keys modifications, and new setuid
      binaries. Investigate any unexpected change with run_diagnostic_command
      (e.g. ss -tlnp to identify the process behind a new port, or
      stat on a new setuid binary). Also review the "Ports Beyond Baseline
      Profile" section when present: each listed port is tagged info, warning,
      or critical against this host's baseline_ports.csv profile. That tag is
      a starting point, not a verdict — cross-reference it against this host's
      stated system purpose (already in your context) before deciding the
      final severity; a port that plainly serves the stated purpose is not
      automatically an incident even if tagged warning or critical here.
      Report changes via report_findings with an appropriate severity — treat
      unexplained new admin users, sudoers changes, new setuid binaries, or an
      unexplained critical-tagged port as critical. Track unresolved suspicious
      changes in the incident ledger and resolve incidents once explained. Do
      not propose remediation commands unless a change is clearly malicious and
      a safe reversal exists. If nothing changed, say so briefly.
    tools:
      - check_security_posture
      - compare_to_baseline
      - run_diagnostic_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: agent-runtime-health
    frequency: "6h"
    instruction: |
      Check the health and stability of this agent's own runtime (the
      agent_patches systemd service). Establish the process lifecycle first
      with run_diagnostic_command:
        systemctl show agent_patches -p MainPID,ExecMainStartTimestamp,NRestarts,ActiveState
      Log the current start time and restart count in your findings. Then
      capture the running agent's memory footprint
      (ps -o pid,rss,vsz,etime,cmd -p <MainPID>) and use read_agent_memory
      with history=true and window="24h" on the timeline domain to correlate
      restarts and memory with recent responsibility runs (start/exit times,
      failures). Scan the system logs for abnormal exits:
        journalctl -u agent_patches --since "-24h" | grep -Ei "exited|killed|signal|failed"
      surfaces SIGTERM/SIGKILL terminations ("code=killed, signal=TERM" or
      "signal=KILL"), and (journalctl -k --since "-24h" | grep -i oom) or
      (dmesg | grep -i "killed process") reveal OOM-killer activity against
      the agent. Then verify the agent's files and data still carry the
      ownership and modes the deployer set:
        stat -c "%a %U:%G %n" /opt/agent_patches /opt/agent_patches/bin \
          /opt/agent_patches/bin/patches-endpoint-server \
          /opt/agent_patches/config /opt/agent_patches/data \
          /opt/agent_patches/logs /opt/agent_patches/config/* \
          /etc/sudoers.d/agent_patches \
          /etc/systemd/system/agent_patches.service /home/agent_patches
      Expected: /opt/agent_patches, bin, and the binary are 750 root:agent_patches;
      config, data, and logs are 750 agent_patches:agent_patches; files under
      config/ are 640 root:agent_patches; /etc/sudoers.d/agent_patches is
      440 root:root; the systemd unit is 644 root:root; /home/agent_patches is
      700 agent_patches:agent_patches. Also run (id agent_patches) and confirm
      the service user is NOT in sudo or wheel (adm, docker, and
      systemd-journal are expected). Report every unexpected termination,
      restart, abnormal memory trend, or permission deviation via
      report_findings — treat SIGKILL/OOM events, a service-user-writable
      binary or sudoers file, group-/world-readable secrets under config/, or
      sudo/wheel membership as high severity. Track recurring lifecycle
      anomalies (e.g. the agent repeatedly restarted or OOM-killed) and
      unexplained permission drift in the incident ledger with a stable
      fingerprint, and resolve incidents once the runtime has been stable
      again. Do not propose remediation commands — this responsibility is
      observation-only; surface anomalies so an operator can act before they
      cause silent failures. If the runtime is stable, say so briefly.
    tools:
      - run_diagnostic_command
      - read_agent_memory
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: daily-summary
    time: "07:00"
    instruction: |
      Summarize overnight system activity, including any errors, restarts,
      or completed patch runs, and produce a short report. Use
      read_agent_memory with history=true and window="24h" on the timeline and
      notifications domains to cover the full night, and compare_to_baseline
      on check_drives and the utilization domains to include day-over-day and
      week-over-week trends (disk growth, load changes). List the open
      incidents from the ledger with how long each has been open, and note any
      incidents resolved since yesterday.
    tools:
      - read_agent_memory
      - compare_to_baseline
      - manage_incidents
    when_to_notify: "always"

  - name: keep-system-up-to-date
    time: "03:00"
    instruction: |
      Pending OS updates were detected on this host (see the pre-gathered
      dry-run report included with this instruction). Use the
      check_for_pending_system_patches tool to analyse their severity, request
      operator approval, and apply them, rebooting if required. Report the
      outcome via report_findings.
    tools:
      - check_for_pending_system_patches
      - report_findings
    when_to_notify: "always"

  # system-insights intentionally has NO pre-check. Every health
  # responsibility above only reaches the LLM when something is already
  # wrong, so on a healthy fleet the model never looks at the system at all
  # and the operator only ever hears about pending patches. This is the one
  # scheduled run guaranteed to put a healthy system in front of the model
  # with an open-ended mandate. Do not "optimize" it behind a pre-check or a
  # problem gate — its cost is bounded at one LLM run per host per day.
  - name: system-insights
    time: "16:00"
    instruction: |
      This is your daily open-ended review. Nothing is known to be wrong —
      your job is to find the insight a skilled human administrator would
      spot anyway: an improvement, an inefficiency, a growing risk, a tuning
      opportunity, or something genuinely interesting about how this host is
      behaving. "Everything is healthy" is not an acceptable conclusion for
      this run.
      To stay fresh and within token budget, examine ONE focus area per day.
      First run (date +%j) via run_diagnostic_command, take the day number
      modulo 10, and work the matching area:
        0. Services — failed or degraded units, suspicious restart counts
           (systemctl --failed; systemctl list-units --state=running | head -30)
        1. Log hygiene — journal disk usage, noisiest units, rotation gaps
           (journalctl --disk-usage; journalctl --since -24h -p warning --no-pager | tail -30)
        2. Scheduled work — cron jobs and systemd timers that are failing,
           stale, or surprising (systemctl list-timers --all | head -20; ls /etc/cron.*)
        3. Performance tuning — swap and iowait behaviour, sysctl or limit
           mismatches for this host's purpose (vmstat 1 3; swapon --show)
        4. Storage layout — growth trends (compare_to_baseline, domain
           check_drives), inode headroom (df -i | head -10), mount options
        5. Package hygiene — old kernels, orphaned or unused packages,
           repository errors
        6. Network — interface errors and drops (ip -s link), DNS health,
           listening services versus this host's stated purpose (ss -tlnp | head -20)
        7. Resilience — uptime versus pending reboot, services still running
           pre-upgrade binaries, core dumps present, time sync status
        8. Hardening — sshd_config highlights, firewall presence and state,
           automatic-update configuration
        9. Resource fit — steady-state top consumers versus installed
           RAM/CPU: is this host over- or under-provisioned for its purpose?
      Investigate with run_diagnostic_command. Keep every command's output
      small — always bound it with head/tail/-n; never dump whole files or
      recursive listings. Use compare_to_baseline or read_agent_memory when
      history would strengthen the story.
      Then record 1-3 findings via report_findings (type=recommendation or
      observation, severity usually info) — concrete, specific to this host,
      with the evidence and the why. Prefer one sharp insight over a survey.
      If a previous run already raised something in this area (it will appear
      in the open-incidents list, or be obviously still true), find something
      new rather than repeating it. Do not propose or execute remediation
      commands from this run — recommendations only.
    tools:
      - run_diagnostic_command
      - compare_to_baseline
      - read_agent_memory
      - report_findings
    when_to_notify: "always"
