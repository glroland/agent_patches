# windows-responsibilities.yaml — Default responsibilities for Windows hosts.
#
# Loaded automatically at startup when the server is running on Windows,
# alongside the main config.yaml in the same directory.
# Any responsibility defined in config.yaml with the same name overrides the
# entry here; responsibilities with unique names are additive.
#
# Each entry must set exactly one of:
#   frequency: Go duration string (e.g. "1h", "30m") — recurring
#   time:      local HH:MM wall-clock time — once-daily
#
# "tools" names the skills available during the run.
# "when_to_notify": "always" | "on_error" (default) | "never"
#
# NOTE: the responsibility names below are bound to deterministic pre-checks
# registered in endpoint-server/main.go. A pre-check runs the health survey
# without the LLM and skips the LLM call entirely when everything is healthy;
# the instruction only reaches the model when a problem was found, with the
# pre-gathered report appended. Renaming a responsibility detaches its
# pre-check, and every scheduled tick pays for a full LLM run again.

responsibilities:
  - name: disk-space-check
    frequency: "4h"
    instruction: |
      A disk problem was detected on this host — see the pre-gathered report
      included with this instruction (usage, SMART status, and the largest
      directories per drive). Do not call check_drives again unless you want
      a fresh read. Compare current usage against
      history with compare_to_baseline (domain: check_drives): report each
      drive's growth rate and, for any drive trending upward, the predicted
      time until full.
      If any drive is above 90% capacity, use run_diagnostic_command to
      investigate the root cause — for example:
        Get-ChildItem C:\ -Recurse -ErrorAction SilentlyContinue |
          Sort-Object Length -Descending | Select-Object -First 20 FullName, Length
      Once you have identified a safe remediation (e.g. clearing old logs or
      temp files under C:\Windows\Temp), submit that command via
      run_approved_command for operator approval before executing it. Do not
      propose commands for SMART hardware failures — report those findings only.
      Track persistent problems in the incident ledger: report new ones with a
      stable fingerprint, record recurrences and actions, and resolve incidents
      that have cleared.
    tools:
      - check_drives
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: cpu-utilization-check
    frequency: "1h"
    instruction: |
      Elevated CPU load was detected on this host — usage at/above 80% or a
      load average exceeding the logical CPU count. See the pre-gathered
      report included with this instruction; do not call
      analyze_cpu_utilization again unless you want a fresh read.
      Use compare_to_baseline
      (domain: analyze_cpu_utilization) to judge whether current load is normal
      for this host — distinguish sustained pressure from a momentary spike.
      Use run_diagnostic_command to investigate —
      for example:
        Get-Process | Sort-Object CPU -Descending | Select-Object -First 20 Name, CPU, Id
      Report your findings. Only use run_approved_command if you determine a
      specific remediation action is warranted and safe to propose.
      Do not act if CPU usage is within normal bounds. Track persistent
      problems (e.g. the same runaway process seen across runs) in the incident
      ledger rather than re-reporting them each time, and resolve incidents
      that have cleared.
    tools:
      - analyze_cpu_utilization
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: memory-utilization-check
    frequency: "1h"
    instruction: |
      A memory problem was detected on this host — RAM usage at/above 80%, or
      day-over-day growth of 20+ percentage points that suggests a leak. See
      the pre-gathered report included with this instruction; do not call
      analyze_memory_utilization again unless you want a fresh read.
      Use compare_to_baseline
      (domain: analyze_memory_utilization) to compare against this host's
      normal usage and judge whether the pressure is persistent or growing.
      Use run_diagnostic_command to
      gather details — for example:
        Get-CimInstance Win32_OperatingSystem |
          Select-Object TotalVisibleMemorySize, FreePhysicalMemory
        Get-Process | Sort-Object WorkingSet -Descending |
          Select-Object -First 20 Name, WorkingSet, Id
      If memory usage is above 80%, report the top consumers. For sustained
      critical pressure above 90% where a specific safe remediation exists,
      propose it via run_approved_command for operator approval.
      Do not act if memory is within normal bounds. Track persistent problems
      in the incident ledger and resolve incidents that have cleared.
    tools:
      - analyze_memory_utilization
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: network-utilization-check
    frequency: "2h"
    instruction: |
      Unusual network traffic was detected on this host — the current rate
      exceeds 3x this host's 7-day median, or the host is too new to have a
      baseline yet. See the pre-gathered report included with this
      instruction; do not call analyze_network_utilization again unless you
      want a fresh read. Use compare_to_baseline
      (domain: analyze_network_utilization) for additional historical context.
      Use run_diagnostic_command to
      investigate — for example:
        netstat -ano | Select-String ESTABLISHED | Select-Object -First 40
        Get-NetTCPConnection -State Established |
          Select-Object LocalAddress, LocalPort, RemoteAddress, RemotePort, OwningProcess
      Report findings even when no action is needed. Only use
      run_approved_command if a specific remediation is warranted; do not
      propose commands unless traffic is clearly anomalous. Track persistent
      anomalies in the incident ledger and resolve incidents that have cleared.
    tools:
      - analyze_network_utilization
      - compare_to_baseline
      - run_diagnostic_command
      - run_approved_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: security-posture-check
    time: "06:00"
    instruction: |
      Review this host's security posture for drift. Run check_security_posture
      to capture the current posture (listening ports with owning processes,
      enabled local users, Administrators group membership) and compare it
      against the previous snapshot. Focus on what CHANGED — new or removed
      listening ports, new users, or new Administrators members. Investigate
      any unexpected change with run_diagnostic_command — for example:
        Get-NetTCPConnection -State Listen -LocalPort <port> |
          Select-Object OwningProcess
        Get-Process -Id <pid> | Select-Object Name, Path
      Also review the "Ports Beyond Baseline Profile" section when present:
      each listed port is tagged info, warning, or critical against this
      host's baseline_ports.csv profile. That tag is a starting point, not a
      verdict — cross-reference it against this host's stated system purpose
      (already in your context) before deciding the final severity; a port
      that plainly serves the stated purpose is not automatically an incident
      even if tagged warning or critical here. Report changes via
      report_findings with an appropriate severity — treat an unexplained new
      Administrators member or an unexplained critical-tagged port as
      critical. Track unresolved suspicious changes in the incident ledger and
      resolve incidents once explained. Do not propose remediation commands
      unless a change is clearly malicious and a safe reversal exists. If
      nothing changed, say so briefly.
    tools:
      - check_security_posture
      - compare_to_baseline
      - run_diagnostic_command
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: agent-runtime-health
    frequency: "6h"
    instruction: |
      Check the health and stability of this agent's own runtime (the
      agent_patches Windows service). Establish the process lifecycle first
      with run_diagnostic_command:
        Get-CimInstance Win32_Service -Filter "Name='agent_patches'" |
          Select-Object State, ProcessId, StartMode
      Then capture the running agent's memory footprint and start time:
        Get-Process -Id <ProcessId> |
          Select-Object Name, Id, StartTime, WorkingSet64, PrivateMemorySize64
      and use read_agent_memory with history=true and window="24h" on the
      timeline domain to correlate restarts and memory with recent
      responsibility runs (start/exit times, failures). Scan the System event
      log for abnormal service exits — unexpected terminations (event 7031/
      7034) are the Windows equivalent of SIGTERM/SIGKILL:
        Get-WinEvent -FilterHashtable @{LogName='System';
          ProviderName='Service Control Manager'; Id=7031,7034,7036;
          StartTime=(Get-Date).AddHours(-24)} |
          Where-Object { $_.Message -like "*agent_patches*" } |
          Select-Object TimeCreated, Id, Message
      Then verify the agent's files and data still carry the ACLs the deployer
      set on C:\ProgramData\agent_patches (inheritance removed; full control
      for SYSTEM and BUILTIN\Administrators only):
        Get-Acl C:\ProgramData\agent_patches |
          Select-Object Owner, AreAccessRulesProtected, AccessToString
        Get-ChildItem C:\ProgramData\agent_patches -Directory |
          Get-Acl | Select-Object PSPath, AreAccessRulesProtected, AccessToString
      Flag any access rule granting other users or groups (e.g. Users,
      Everyone, Authenticated Users) rights on the install dir or the bin,
      config, data, or logs subdirectories, and any directory where
      AreAccessRulesProtected is false (inheritance re-enabled). Also confirm
      the service still runs as the dedicated account:
        Get-CimInstance Win32_Service -Filter "Name='agent_patches'" |
          Select-Object StartName
      should report .\agent_patches. Report every unexpected termination,
      restart, abnormal memory trend, or ACL deviation via report_findings —
      treat unexpected terminations (7031/7034), broadened ACLs on config or
      the binary, or a changed service account as high severity. Track
      recurring lifecycle anomalies (e.g. the service repeatedly crashing or
      restarting) and unexplained permission drift in the incident ledger with
      a stable fingerprint, and resolve incidents once the runtime has been
      stable again. Do not propose remediation commands — this responsibility
      is observation-only; surface anomalies so an operator can act before
      they cause silent failures. If the runtime is stable, say so briefly.
    tools:
      - run_diagnostic_command
      - read_agent_memory
      - report_findings
      - manage_incidents
    when_to_notify: "on error"

  - name: daily-summary
    time: "07:00"
    instruction: |
      Summarize overnight system activity, including any errors, service
      restarts, or completed patch runs, and produce a short report. Use
      read_agent_memory with history=true and window="24h" on the timeline and
      notifications domains to cover the full night, and compare_to_baseline
      on check_drives and the utilization domains to include day-over-day and
      week-over-week trends (disk growth, load changes). List the open
      incidents from the ledger with how long each has been open, and note any
      incidents resolved since yesterday.
    tools:
      - read_agent_memory
      - compare_to_baseline
      - manage_incidents
    when_to_notify: "always"

  - name: keep-system-up-to-date
    time: "03:00"
    instruction: |
      Pending Windows updates were detected on this host (see the pre-gathered
      dry-run report included with this instruction). Use the
      check_for_pending_system_patches tool to analyse their severity, request
      operator approval, and apply them, rebooting if required. Report the
      outcome via report_findings.
    tools:
      - check_for_pending_system_patches
      - report_findings
    when_to_notify: "always"

  # system-insights intentionally has NO pre-check. Every health
  # responsibility above only reaches the LLM when something is already
  # wrong, so on a healthy fleet the model never looks at the system at all
  # and the operator only ever hears about pending patches. This is the one
  # scheduled run guaranteed to put a healthy system in front of the model
  # with an open-ended mandate. Do not "optimize" it behind a pre-check or a
  # problem gate — its cost is bounded at one LLM run per host per day.
  - name: system-insights
    time: "16:00"
    instruction: |
      This is your daily open-ended review. Nothing is known to be wrong —
      your job is to find the insight a skilled human administrator would
      spot anyway: an improvement, an inefficiency, a growing risk, a tuning
      opportunity, or something genuinely interesting about how this host is
      behaving. "Everything is healthy" is not an acceptable conclusion for
      this run.
      To stay fresh and within token budget, examine ONE focus area per day.
      First run (Get-Date -UFormat %j) via run_diagnostic_command, take the
      day number modulo 10, and work the matching area:
        0. Services — automatic services that are not running, recent service
           crashes (Get-Service | Where-Object {$_.StartType -eq 'Automatic'
           -and $_.Status -ne 'Running'} | Select-Object -First 15)
        1. Event log hygiene — recurring System/Application errors in the
           last 24h (Get-WinEvent -FilterHashtable @{LogName='System';Level=2;
           StartTime=(Get-Date).AddDays(-1)} -MaxEvents 20)
        2. Scheduled tasks — failing, stale, or surprising tasks
           (Get-ScheduledTask | Get-ScheduledTaskInfo | Where-Object
           {$_.LastTaskResult -ne 0} | Select-Object -First 15)
        3. Performance tuning — page file pressure, steady-state top
           consumers versus this host's purpose
        4. Storage layout — growth trends (compare_to_baseline, domain
           check_drives), temp and log folder sizes (bounded queries only)
        5. Update hygiene — pending reboot, age of newest hotfix
           (Get-HotFix | Sort-Object InstalledOn | Select-Object -Last 5)
        6. Network — listening ports versus this host's stated purpose
           (Get-NetTCPConnection -State Listen | Select-Object -First 20),
           DNS client configuration, adapter errors
        7. Resilience — uptime, time sync (w32tm /query /status), crash
           dumps present under C:\Windows\Minidump
        8. Hardening — firewall profile states, RDP configuration, SMBv1
           status, Defender status
        9. Resource fit — steady-state top consumers versus installed
           RAM/CPU: is this host over- or under-provisioned for its purpose?
      Investigate with run_diagnostic_command. Keep every command's output
      small — always bound it with Select-Object -First/-Last; never dump
      whole logs or recursive listings. Use compare_to_baseline or
      read_agent_memory when history would strengthen the story.
      Then record 1-3 findings via report_findings (type=recommendation or
      observation, severity usually info) — concrete, specific to this host,
      with the evidence and the why. Prefer one sharp insight over a survey.
      If a previous run already raised something in this area (it will appear
      in the open-incidents list, or be obviously still true), find something
      new rather than repeating it. Do not propose or execute remediation
      commands from this run — recommendations only.
    tools:
      - run_diagnostic_command
      - compare_to_baseline
      - read_agent_memory
      - report_findings
    when_to_notify: "always"
