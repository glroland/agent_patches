apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: agent-patches
spec:
  destination:
    name: in-cluster
    namespace: agent-patches
    server: https://kubernetes.default.svc
  source:
    path: deploy/helm
    repoURL: https://github.com/glroland/agent_patches.git
    targetRevision: HEAD
    helm:
      valueFiles:
        - values.yaml
  sources: []
  project: default
