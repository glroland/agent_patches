apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.global.registry | default .Values.image.registry }}/{{ .Values.image.name }}:{{ .Values.global.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            # Trust the cluster CA so Node.js native fetch can reach kubernetes.default.svc.
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
            - name: OAUTH_CLIENT_ID
              value: {{ .Values.openshift.oauthClientId | quote }}
            - name: OAUTH_AUTHORIZE_URL
              value: {{ printf "https://oauth-openshift.%s/oauth/authorize" .Values.global.clusterDomain | quote }}
            - name: OAUTH_TOKEN_URL
              value: {{ printf "https://oauth-openshift.%s/oauth/token" .Values.global.clusterDomain | quote }}
            - name: OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: OAUTH_CLIENT_SECRET
            - name: CORS_ORIGIN
              value: {{ printf "https://%s-ui.%s" .Release.Name .Values.global.clusterDomain | quote }}
            - name: AGENT_INVENTORY_FILE
              value: {{ .Values.inventory.mountPath | quote }}
            - name: AGENT_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: AGENT_AUTH_TOKEN
            {{- if .Values.global.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otelExporterOtlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.otel.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            {{- if .Values.global.otelResourceAttributes }}
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: {{ .Values.global.otelResourceAttributes | quote }}
            {{- end }}
            {{- if .Values.global.otelExporterOtlpHeaders }}
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: {{ .Values.global.otelExporterOtlpHeaders | quote }}
            {{- end }}
            {{- if .Values.global.otelTracesSampler }}
            - name: OTEL_TRACES_SAMPLER
              value: {{ .Values.global.otelTracesSampler | quote }}
            {{- end }}
            {{- if .Values.global.otelTracesSamplerArg }}
            - name: OTEL_TRACES_SAMPLER_ARG
              value: {{ .Values.global.otelTracesSamplerArg | quote }}
            {{- end }}
            {{- if .Values.gateway.statsUrl }}
            - name: GATEWAY_STATS_URL
              value: {{ .Values.gateway.statsUrl | quote }}
            - name: GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.gateway.secretName }}
                  key: GATEWAY_AUTH_TOKEN
                  optional: true
            {{- end }}
            {{- if .Values.intelligence.baseUrl }}
            - name: INTELLIGENCE_BASE_URL
              value: {{ .Values.intelligence.baseUrl | quote }}
            - name: INTELLIGENCE_MODEL
              value: {{ .Values.intelligence.model | quote }}
            - name: INTELLIGENCE_INTERVAL_MINUTES
              value: {{ .Values.intelligence.intervalMinutes | quote }}
            - name: INTELLIGENCE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: INTELLIGENCE_API_KEY
                  optional: true
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: inventory
              mountPath: {{ .Values.inventory.mountPath }}
              subPath: inventory.csv
              readOnly: true
      volumes:
        - name: inventory
          configMap:
            name: {{ .Values.inventory.configMapName }}
            defaultMode: 0444
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
