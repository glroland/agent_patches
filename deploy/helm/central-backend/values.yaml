replicaCount: 1

global:
  clusterDomain: apps.example.com

image:
  name: central-backend
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 1000m
    memory: 512Mi
  requests:
    cpu: 500m
    memory: 256Mi

# Name of the pre-existing Secret that holds sensitive credentials.
# Create it manually before first sync:
#   kubectl -n agent-patches create secret generic central-backend-secrets \
#     --from-literal=AGENT_AUTH_TOKEN=<token> \
#     --from-literal=OAUTH_CLIENT_SECRET=<oauth-client-secret> \
#     --from-literal=SESSION_SECRET=$(openssl rand -hex 32) \
#     --from-literal=INTELLIGENCE_API_KEY=<key>   # only if using fleet intelligence
secret:
  name: central-backend-secrets

# Name of the pre-existing ConfigMap that holds the agent inventory CSV.
# Create it manually before first sync:
#   kubectl -n agent-patches create configmap central-backend-inventory \
#     --from-file=inventory.csv=/path/to/your/inventory.csv
# See deploy/inventory-configmap.example.yaml for the expected format.
inventory:
  configMapName: central-backend-inventory
  mountPath: /opt/inventory/inventory.csv

# Fleet intelligence — periodic AI analysis of the whole fleet.
# Set baseUrl to enable. The API key is stored in the secret above.
intelligence:
  # Base URL of an OpenAI-compatible API endpoint.
  # e.g. https://api.openai.com/v1  or  http://my-ollama-host:11434/v1
  baseUrl: "http://evolvewired.home.glroland.com:8080/v1"
  # Model name as the target API expects it.
  model: "Qwen3-Coder-Next-GGUF"
  # How often to re-analyse the fleet (minutes). 0 = once on startup only.
  intervalMinutes: 30

# Persistent storage for fleet intelligence history.
# When enabled, a PVC is provisioned and mounted at /data; reports survive restarts
# and prior analyses are fed back into each LLM prompt for trend detection.
persistence:
  enabled: true
  # Leave empty to use the cluster default StorageClass.
  storageClassName: ""
  size: 1Gi

# HAProxy route timeout. Fleet chat (POST /api/chat/central) can call the
# intelligence endpoint (INTELLIGENCE_TIMEOUT_MS) and then forward to an
# agent (AGENT_MESSAGE_TIMEOUT_MS) within the same request, so this must
# cover their worst-case sum with headroom, not just AGENT_MESSAGE_TIMEOUT_MS
# alone.
route:
  timeout: "25m"

# OTel resource service.name for this component. The collector endpoint and
# other OTel export settings are centralized at the root chart's
# global.otel* values (see deploy/helm/values.yaml) since they're shared
# across components; service name is per-component, so it lives here.
otel:
  serviceName: "central-backend"

# LLM gateway stats integration. statsUrl must be the internal ClusterIP
# address of the llm-gateway service so central-backend can reach it
# without going through the external Route.
gateway:
  statsUrl: "http://llm-gateway:8080"
  # Name of the Secret that holds GATEWAY_AUTH_TOKEN — the same secret used
  # by the llm-gateway deployment. central-backend reads the token to
  # authenticate its /api/gateway/stats calls.
  secretName: "llm-gateway-secrets"

env:
  HOST: "0.0.0.0"
  PORT: "8080"
  AGENT_POLL_INTERVAL_SECONDS: "60"
  AGENT_POLL_TIMEOUT_MS: "3000"
  AGENT_MESSAGE_TIMEOUT_MS: "180000"
  LOG_LEVEL: "info"
  # Timeout (ms) for calls to the intelligence endpoint (fleet chat, daily
  # briefing, periodic analysis). Default 1200000 (20m), matching the
  # llm-gateway request timeout these calls flow through — keep route.timeout
  # well above this plus AGENT_MESSAGE_TIMEOUT_MS in the worst case
  # (chat routes to an agent after the intelligence call).
  # INTELLIGENCE_TIMEOUT_MS: "1200000"

# OpenShift OAuth integration.
# The OAuthClient resource must be created separately (it is cluster-scoped).
# Add OAUTH_CLIENT_SECRET to the central-backend-secrets Secret before deploying.
openshift:
  # Name of the OAuthClient registered in OpenShift (must match the resource name).
  # OAuth server URLs are derived from global.clusterDomain — no need to set them here.
  oauthClientId: "agent-patches"
  # Set to true when the cluster ingress uses a self-signed or internal CA that
  # Node.js does not trust by default (common in home-lab / air-gapped clusters).
  tlsInsecure: true

nodeSelector: {}

tolerations: []

affinity: {}
