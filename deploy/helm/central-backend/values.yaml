replicaCount: 1

image:
   repository: registry.home.glroland.com/agent_patches/central-backend
   tag: latest
   pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

# Name of the pre-existing Secret that holds AGENT_AUTH_TOKEN.
# Create it manually before first sync:
#   kubectl -n agent-patches create secret generic central-backend-secrets \
#     --from-literal=AGENT_AUTH_TOKEN=<token>
secret:
  name: central-backend-secrets

env:
  HOST: "0.0.0.0"
  PORT: "8080"
  CORS_ORIGIN: "http://localhost:5173"
  AGENT_POLL_INTERVAL_SECONDS: "60"
  AGENT_INVENTORY_FILE: "./inventory.example.csv"
  LOG_LEVEL: "info"

nodeSelector: {}

tolerations: []

affinity: {}
