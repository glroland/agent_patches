apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      serviceAccountName: {{ .Chart.Name }}-proxy
      containers:
        # ── Application container (nginx) ────────────────────────────────────
        # Binds only to 127.0.0.1 — all traffic must enter via the
        # oauth-proxy sidecar; the port is never reachable from the pod network.
        - name: {{ .Chart.Name }}
          image: "{{ .Values.global.registry | default .Values.image.registry }}/{{ .Values.image.name }}:{{ .Values.global.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: BACKEND_URL
              value: {{ printf "https://%s-backend.%s" .Release.Name .Values.global.clusterDomain | quote }}
            {{- if .Values.global.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otelExporterOtlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.otel.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}

        # ── OAuth proxy sidecar ──────────────────────────────────────────────
        # Intercepts all inbound traffic on port 4180. Unauthenticated requests
        # are redirected to the OpenShift OAuth server. After login the SAR
        # policy is evaluated — only users that can list nodes (cluster-admin
        # by default) are granted access. Authenticated requests are forwarded
        # to localhost:{{ .Values.containerPort }} (nginx above).
        - name: oauth-proxy
          image: {{ .Values.oauthProxy.image | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: proxy
              containerPort: 4180
              protocol: TCP
          args:
            - --http-address=:4180
            - --provider=openshift
            - "--openshift-service-account={{ .Chart.Name }}-proxy"
            - "--upstream=http://localhost:{{ .Values.containerPort }}"
            - --cookie-secret-file=/etc/proxy/secrets/session_secret
            - --openshift-sar={{ .Values.oauthProxy.sar }}
            - --email-domain=*
            - --cookie-secure=true
            - --cookie-httponly=true
          volumeMounts:
            - name: proxy-secret
              mountPath: /etc/proxy/secrets
              readOnly: true
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /oauth/healthz
              port: proxy
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /oauth/healthz
              port: proxy
            initialDelaySeconds: 5
            periodSeconds: 30

      volumes:
        - name: proxy-secret
          secret:
            secretName: {{ .Values.oauthProxy.cookieSecretName }}
            items:
              - key: session_secret
                path: session_secret

      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
