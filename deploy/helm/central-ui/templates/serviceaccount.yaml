apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Chart.Name }}-proxy
  labels:
    app: {{ .Chart.Name }}
  annotations:
    # Tells OpenShift's OAuth server to accept the Route URL as a valid
    # redirect URI for this ServiceAccount's OAuth client, so the proxy
    # can complete the authorization code flow without a manually-created
    # OAuthClient object.
    serviceaccounts.openshift.io/oauth-redirectreference.primary: >-
      {"kind":"OAuthRedirectReference","apiVersion":"v1","reference":{"kind":"Route","name":"{{ .Chart.Name }}"}}
