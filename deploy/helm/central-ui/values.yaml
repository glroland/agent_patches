replicaCount: 1

global:
  clusterDomain: apps.example.com

image:
  name: central-ui
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 4180

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

backend:
  serviceName: central-backend
  servicePort: 8080

# HAProxy route timeout and nginx proxy read timeout for long-running API calls
# (agent chat, tool-use loops with operator approval). Both must exceed
# AGENT_MESSAGE_TIMEOUT_MS on the backend (currently 180s).
route:
  timeout: "300s"
  proxyReadTimeout: "300s"

# OTel collector endpoint is centralized at the root chart's
# global.otelExporterOtlpEndpoint (see deploy/helm/values.yaml) rather than
# managed here, since central-backend and central-ui share the same
# collector. nginx proxies the fixed path /v1/traces to it so the browser
# bundle never needs to know the collector's address and never hits CORS —
# see entrypoint.sh / nginx.conf.template. Unset (the default) leaves
# /v1/traces pointed at a harmless loopback placeholder.
env: {}

# OTel resource service.name for this component (per-component, unlike the
# shared collector endpoint above). entrypoint.sh writes this into a small
# runtime-config script the browser bundle reads at startup, since a static
# bundle can't read container env vars directly.
otel:
  serviceName: "central-ui"

# OpenShift OAuth proxy sidecar — enforces login via the cluster's built-in
# OAuth server before any request reaches nginx.
oauthProxy:
  # Red Hat official image. Pin to the minor version that matches your cluster.
  image: "registry.redhat.io/openshift4/ose-oauth-proxy:v4.20"
  # OpenShift Subject Access Review sent as the authenticated user.
  # The default allows only users who can list nodes — in practice this means
  # cluster-admin (or any ClusterRole that grants nodes/list).
  # To tighten further, restrict to a specific group or namespace role.
  sar: '{"resource":"nodes","verb":"list"}'
  # Name of the pre-existing Secret that holds the session cookie key.
  # Create it once before first deploy:
  #   kubectl -n agent-patches create secret generic central-ui-proxy-secret \
  #     --from-literal=session_secret=$(openssl rand -base64 32 | tr -d '\n')
  cookieSecretName: "central-ui-proxy-secret"

nodeSelector: {}

tolerations: []

affinity: {}
