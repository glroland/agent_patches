replicaCount: 1

global:
  clusterDomain: apps.example.com

image:
  name: central-ui
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 100m
    memory: 128Mi
  requests:
    cpu: 50m
    memory: 64Mi

backend:
  serviceName: central-backend
  servicePort: 8080

nodeSelector: {}

tolerations: []

affinity: {}
