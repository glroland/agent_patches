apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Chart.Name }}
  labels:
    app: {{ .Chart.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ .Chart.Name }}
  template:
    metadata:
      labels:
        app: {{ .Chart.Name }}
    spec:
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.global.registry | default .Values.image.registry }}/{{ .Values.image.name }}:{{ .Values.global.tag | default .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
              protocol: TCP
          env:
            - name: GATEWAY_LISTEN_ADDR
              value: ":{{ .Values.containerPort }}"
            - name: GATEWAY_UPSTREAM_URL
              value: {{ .Values.gateway.upstreamURL | quote }}
            {{- if .Values.gateway.upstreamModel }}
            - name: GATEWAY_UPSTREAM_MODEL
              value: {{ .Values.gateway.upstreamModel | quote }}
            {{- end }}
            - name: GATEWAY_MAX_CONCURRENCY
              value: {{ .Values.gateway.maxConcurrency | quote }}
            - name: GATEWAY_MAX_QUEUE_DEPTH
              value: {{ .Values.gateway.maxQueueDepth | quote }}
            - name: GATEWAY_REQUEST_TIMEOUT
              value: {{ .Values.gateway.requestTimeout | quote }}
            - name: GATEWAY_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: GATEWAY_AUTH_TOKEN
            {{- if .Values.global.otelExporterOtlpEndpoint }}
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.global.otelExporterOtlpEndpoint | quote }}
            {{- end }}
            {{- if .Values.otel.serviceName }}
            - name: OTEL_SERVICE_NAME
              value: {{ .Values.otel.serviceName | quote }}
            {{- end }}
            {{- if .Values.persistence.enabled }}
            - name: GATEWAY_DATA_FILE
              value: {{ .Values.persistence.dataFile | quote }}
            - name: GATEWAY_SAVE_INTERVAL
              value: {{ .Values.persistence.saveInterval | quote }}
            {{- end }}
          {{- if .Values.persistence.enabled }}
          volumeMounts:
            - name: data
              mountPath: {{ .Values.persistence.mountPath | quote }}
          {{- end }}
          readinessProbe:
            # Deliberately the plain liveness path, not /health/ready: that
            # path makes the gateway call the upstream's GET /v1/models,
            # which can queue/contend behind real inference traffic on
            # single-request upstream LLM servers. Gating this pod's own
            # Service readiness on that would make it flap out of rotation
            # under normal load. /health/ready still exists for manual/
            # monitoring use to confirm the configured model is reachable.
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
      {{- if .Values.persistence.enabled }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ .Chart.Name }}-data
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
