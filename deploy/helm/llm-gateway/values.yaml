replicaCount: 1

global:
  clusterDomain: apps.example.com

image:
  name: llm-gateway
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: ClusterIP
  port: 8080

resources:
  limits:
    cpu: 200m
    memory: 64Mi
  requests:
    cpu: 50m
    memory: 32Mi

# HAProxy route timeout. Must exceed GATEWAY_REQUEST_TIMEOUT so HAProxy
# does not cut the connection before the gateway returns a 504 of its own.
route:
  timeout: "305s"

# Gateway tuning. These map 1-to-1 to GATEWAY_* environment variables.
# Override in deploy/helm/values.yaml under the llm-gateway: key.
gateway:
  # URL of the self-hosted LLM (OpenAI-compatible API).
  # Example: http://my-ollama-host:11434
  upstreamURL: ""
  # Maximum number of requests forwarded to the LLM simultaneously.
  maxConcurrency: "2"
  # Maximum number of requests waiting in the FIFO queue. Requests that
  # arrive when the queue is full receive a 429 immediately.
  maxQueueDepth: "50"
  # Per-request timeout (Go duration string). Applies to both regular and
  # streaming calls; the semaphore slot is held for the full duration.
  requestTimeout: "5m"

# OTel resource service.name — shared collector endpoint lives at root values.
otel:
  serviceName: "llm-gateway"

nodeSelector: {}
tolerations: []
affinity: {}
