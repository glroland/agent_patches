global:
  registry: registry.home.glroland.com/agent_patches
  tag: "49"
  clusterDomain: apps.ocp.home.glroland.com

  # Optional OpenTelemetry trace export — same OTEL_* env var names used by
  # endpoint-server. Centralized here rather than per-chart since
  # central-backend and central-ui both point at the same collector.
  # Unset (the default) disables tracing entirely for both.
  otelExporterOtlpEndpoint: "http://eclipse.home.glroland.com:4318"
  otelResourceAttributes: ""
  otelExporterOtlpHeaders: ""
  otelTracesSampler: ""
  otelTracesSamplerArg: ""

central-backend:
  image:
    name: central-backend
    pullPolicy: Always
  containerPort: 8080
  service:
    port: 8080
  env:
    HOST: "0.0.0.0"
    PORT: "8080"
    AGENT_POLL_INTERVAL_SECONDS: "60"
    LOG_LEVEL: "info"

central-ui:
  image:
    name: central-ui
    pullPolicy: Always
  containerPort: 8080
  service:
    port: 8080

# LLM request queuing gateway.
# Set gateway.upstreamURL to your self-hosted LLM base URL.
# Endpoint-servers should then point agent.base_url at the gateway Route:
#   https://central-gateway.<clusterDomain>
llm-gateway:
  image:
    name: llm-gateway
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 8080
  gateway:
    upstreamURL: "http://evolvewired.home.glroland.com:8080"
    # Display-only label shown in central-ui alongside the upstream URL. Purely
    # informational — leave blank to hide the "Model Name" line in the UI.
    upstreamModel: "Qwen3-Coder-Next-GGUF"
    maxConcurrency: "2"
    maxQueueDepth: "100"
    requestTimeout: "20m"
