global:
  registry: registry.home.glroland.com/agent_patches
  tag: "12"
  clusterDomain: apps.ocp.home.glroland.com

central-backend:
  image:
    name: central-backend
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 8080
  env:
    HOST: "0.0.0.0"
    PORT: "8080"
    AGENT_POLL_INTERVAL_SECONDS: "60"
    AGENT_INVENTORY_FILE: "./inventory.example.csv"
    LOG_LEVEL: "info"

central-ui:
  image:
    name: central-ui
    pullPolicy: IfNotPresent
  containerPort: 8080
  service:
    port: 8080
