---
# Sample inventory for agent_patches deployment.
# Copy to inventory.yml, fill in your hosts, then run:
#   ansible-playbook -i deploy/linux/inventory.yml deploy/linux/playbook.yml

all:
  vars:
    # SSH user with sudo/become access on all hosts.
    ansible_user: deploy

  children:
    agent_patches:
      vars:
        # Override per-group if your hosts use a non-standard SSH port.
        # ansible_port: 22

        # Set to "false" to skip host-key checking in trusted networks.
        # ansible_host_key_checking: true

      hosts:
        server1:
          ansible_host: 192.168.1.10
        server2:
          ansible_host: 192.168.1.11
        # prod-web-01:
        #   ansible_host: 10.0.0.50
        #   ansible_user: admin       # per-host override
        #   ansible_port: 2222
