---
# Deploys the agent_patches server to every host in the inventory.
# Run as root: ansible-playbook -i <inventory> deploy/playbook.yml
#
# The server binary must be built locally before running this playbook:
#   make release
#
# To redeploy after a binary update:
#   make release && ansible-playbook -i <inventory> deploy/playbook.yml
#
# Config is deployed from config.example.yaml on first run only (force: false).
# Edit /opt/agent_patches/config/config.yaml on the target host after deployment,
# then restart the service: systemctl restart agent_patches

- name: Deploy agent_patches server
  hosts: all
  become: true

  vars:
    install_root: /opt/agent_patches
    service_user: agent_patches
    binary_src: "{{ playbook_dir }}/../target/linux-x86_64/patches-endpoint-server"
    config_src: "{{ playbook_dir }}/../../../home-utils/admin/agent_patches/endpoint-server-config.yaml"
    # nologin path differs between Debian (/usr/sbin) and Fedora (/sbin)
    nologin_shell: "{{ '/usr/sbin/nologin' if ansible_os_family == 'Debian' else '/sbin/nologin' }}"

  tasks:
    - name: Create agent_patches system user
      ansible.builtin.user:
        name: "{{ service_user }}"
        system: true
        create_home: false
        shell: "{{ nologin_shell }}"
        comment: agent_patches service account
        groups: wheel
        append: true

    - name: Create directory structure
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "{{ item.mode }}"
      loop:
        - path: "{{ install_root }}"
          mode: "0750"
        - path: "{{ install_root }}/bin"
          mode: "0755"
        - path: "{{ install_root }}/config"
          mode: "0750"

    - name: Set ownership of install root recursively
      ansible.builtin.file:
        path: "{{ install_root }}"
        state: directory
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        recurse: true

    - name: Deploy server binary
      ansible.builtin.copy:
        src: "{{ binary_src }}"
        dest: "{{ install_root }}/bin/patches-endpoint-server"
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0755"
      notify: Restart agent_patches

    - name: Deploy systemd unit file
      ansible.builtin.copy:
        src: agent_patches.service
        dest: /etc/systemd/system/agent_patches.service
        owner: root
        group: root
        mode: "0644"
      notify: Reload systemd

    # Flush here so systemd knows about the unit before we ask it to start.
    - name: Flush handlers
      ansible.builtin.meta: flush_handlers

    - name: Deploy default config (skipped when config already exists)
      ansible.builtin.copy:
        src: "{{ config_src }}"
        dest: "{{ install_root }}/config/config.yaml"
        owner: "{{ service_user }}"
        group: "{{ service_user }}"
        mode: "0640"
        force: false
      register: config_deployed

    - name: Warn that config needs customisation after first deploy
      ansible.builtin.debug:
        msg: >-
          Config deployed to {{ install_root }}/config/config.yaml.
          Edit it (bearer token, SMTP credentials, Claude model) then run
          'systemctl restart agent_patches' on {{ inventory_hostname }}.
      when: config_deployed.changed

    - name: Enable and start agent_patches service
      ansible.builtin.systemd:
        name: agent_patches
        enabled: true
        state: started

  handlers:
    - name: Reload systemd
      ansible.builtin.systemd:
        daemon_reload: true

    # daemon_reload included so a unit-file change + binary change in the same
    # run reloads systemd before restarting.
    - name: Restart agent_patches
      ansible.builtin.systemd:
        name: agent_patches
        state: restarted
        daemon_reload: true
